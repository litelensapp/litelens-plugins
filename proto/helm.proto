syntax = "proto3";

package helm;

option go_package = "github.com/gknguyen/litelens/plugins/helm/go/internal/pb;";

service Helm {
  rpc ListHelmCharts(Empty) returns (ListHelmChartsResponse);
  rpc ListHelmRepositories(Empty) returns (ListHelmRepositoriesResponse);
  rpc ListHelmReleases(ListHelmReleasesRequest) returns (ListHelmReleasesResponse);
  rpc ListHelmChartVersions(ListHelmChartVersionsRequest) returns (ListHelmChartVersionsResponse);
  rpc GetHelmChartDetail(GetHelmChartDetailRequest) returns (HelmChartDetail);
  rpc GetArtifactHubReadme(GetArtifactHubReadmeRequest) returns (GetArtifactHubReadmeResponse);
  rpc InstallHelmChart(InstallHelmChartRequest) returns (Empty);
  rpc UpgradeHelmRelease(UpgradeHelmReleaseRequest) returns (Empty);
  rpc DeleteHelmRelease(DeleteHelmReleaseRequest) returns (Empty);
  rpc DeleteHelmReleaseWithCleanup(DeleteHelmReleaseRequest) returns (Empty);
  rpc GetHelmReleaseByName(GetHelmReleaseByNameRequest) returns (HelmReleaseDetail);
  rpc GetHelmChartValues(GetHelmChartValuesRequest) returns (GetHelmChartValuesResponse);
  rpc GetHelmReleaseHistory(GetHelmReleaseHistoryRequest) returns (GetHelmReleaseHistoryResponse);
  rpc RollbackHelmRelease(RollbackHelmReleaseRequest) returns (Empty);
  rpc GetCapabilities(Empty) returns (CapabilitiesResponse);
}

message Empty {}

// DTOs

message HelmChart {
  string name = 1;
  string description = 2;
  string version = 3;
  string appVersion = 4;
  string repository = 5;
  string icon = 6;
}

message HelmChartDetail {
  string name = 1;
  string description = 2;
  string version = 3;
  string appVersion = 4;
  string repository = 5;
  string icon = 6;
  string home = 7;
  repeated string keywords = 8;
  repeated string sources = 9;
  repeated string maintainers = 10;
}

message HelmRepository {
  string name = 1;
  string url = 2;
}

message HelmRelease {
  string name = 1;
  string namespace = 2;
  string chart = 3;
  string chartVersion = 4;
  string appVersion = 5;
  string status = 6;
  int32 revision = 7;
  string updated = 8;
  string updatedAt = 9;
  string repository = 10;
  string encodedValuesYAML = 11;
}

message HelmReleaseResource {
  string kind = 1;
  string name = 2;
  string namespace = 3;
}

message HelmReleaseDetail {
  string name = 1;
  string namespace = 2;
  string chart = 3;
  string chartVersion = 4;
  string appVersion = 5;
  string status = 6;
  int32 revision = 7;
  string updated = 8;
  string updatedAt = 9;
  string notes = 10;
  string valuesYAML = 11;
  repeated HelmReleaseResource resources = 12;
  string repository = 13;
}

message HelmReleaseRevisionHistory {
  int32 revision = 1;
  string chartVersion = 2;
  string appVersion = 3;
  string status = 4;
  string updatedAt = 5;
}

// RPC Request/Response messages

message ListHelmReleasesRequest {
  string namespace = 1;
}

message ListHelmReleasesResponse {
  repeated HelmRelease releases = 1;
}

message ListHelmChartsResponse {
  repeated HelmChart charts = 1;
}

message ListHelmRepositoriesResponse {
  repeated HelmRepository repositories = 1;
}

message ListHelmChartVersionsRequest {
  string repository = 1;
  string chartName = 2;
}

message ListHelmChartVersionsResponse {
  repeated string versions = 1;
}

message GetHelmChartDetailRequest {
  string repository = 1;
  string chartName = 2;
  string version = 3;
}

message GetArtifactHubReadmeRequest {
  string repo = 1;
  string chartName = 2;
  string version = 3;
}

message GetArtifactHubReadmeResponse {
  string readme = 1;
}

message InstallHelmChartRequest {
  string namespace = 1;
  string releaseName = 2;
  string repository = 3;
  string chartName = 4;
  string version = 5;
  string valuesYAML = 6;
}

message UpgradeHelmReleaseRequest {
  string namespace = 1;
  string releaseName = 2;
  string repository = 3;
  string chartName = 4;
  string version = 5;
  string valuesYAML = 6;
}

message DeleteHelmReleaseRequest {
  string namespace = 1;
  string releaseName = 2;
}

message GetHelmReleaseByNameRequest {
  string namespace = 1;
  string releaseName = 2;
}

message GetHelmChartValuesRequest {
  string repository = 1;
  string chartName = 2;
  string version = 3;
}

message GetHelmChartValuesResponse {
  string valuesYAML = 1;
}

message GetHelmReleaseHistoryRequest {
  string namespace = 1;
  string releaseName = 2;
}

message GetHelmReleaseHistoryResponse {
  repeated HelmReleaseRevisionHistory history = 1;
}

message RollbackHelmReleaseRequest {
  string namespace = 1;
  string releaseName = 2;
  int32 revision = 3;
}

message CapabilitiesResponse {
  string version = 1;
  bool ready = 2;
  repeated string features = 3;
}
