name: Build Plugin

on:
  workflow_call:
    inputs:
      plugin_id:
        type: string
        required: true
        # Short plugin identifier, e.g. "helm". Drives pnpm script names
        # (build:<plugin_id>, build:<plugin_id>:fe), the plugins/<plugin_id>/
        # source path, and every artifact name (litelens-plugin-<plugin_id>-...).
      plugin_name:
        type: string
        required: true
        # Display name for the manifest, e.g. "Helm".
      plugin_description:
        type: string
        required: true
      plugin_homepage:
        type: string
        required: true
      plugin_capabilities:
        type: string
        required: true
        # Comma-separated capability list, e.g. "helm-charts,helm-releases".
      plugin_binary_name:
        type: string
        required: true
        # Binary filename baked into the manifest's assets.binaryName, e.g. "plugin-helm".
      version:
        type: string
        required: false
        default: "dev"
        # Set to "latest" to resolve to the current latest GitHub release at runtime
        # (used by CI test wiring so it never needs to be hand-bumped).

jobs:
  detect-changes:
    name: Detect Plugin Changes
    uses: ./.github/workflows/job-detect-changes.yml
    with:
      paths: |
        plugins/${{ inputs.plugin_id }}/**
        pnpm-lock.yaml
        package.json
        pnpm-workspace.yaml
        .github/workflows/job-build.yml
        .github/actions/setup-go/**
        .github/actions/setup-node-pnpm/**

  run:
    needs: [detect-changes]
    if: ${{ needs.detect-changes.outputs.changed == 'true' }}
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin/arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - os: windows-latest
            platform: windows/amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
          - os: ubuntu-latest
            platform: linux/amd64
            goos: linux
            goarch: amd64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go from go.mod
        uses: ./.github/actions/setup-go
        with:
          go-version-file: plugins/${{ inputs.plugin_id }}/go.mod

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          ignore-scripts: "false"

      - name: Compute artifact names
        id: artifact
        shell: bash
        run: |
          NAME="litelens-plugin-${{ inputs.plugin_id }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          FRONTEND="litelens-plugin-${{ inputs.plugin_id }}-frontend"
          echo "name=${NAME}${{ matrix.ext }}" >> "$GITHUB_OUTPUT"
          echo "frontend_name=${FRONTEND}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Resolve release version
        id: resolve-version
        if: ${{ inputs.version != 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ inputs.version }}" == "latest" ]; then
            VERSION=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}")
            echo "Resolved 'latest' -> $VERSION"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build plugin binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ inputs.version }}
          OUTPUT: ../../build/plugin-bin/${{ steps.artifact.outputs.name }}
        run: pnpm build:${{ inputs.plugin_id }}

      - name: Build plugin frontend
        # Frontend bundle is OS-agnostic, so only built and uploaded once on Linux.
        # Uses the same build:<plugin_id>:fe script as local dev to guarantee
        # the dist/ output (index.js + chunk-*.js files) is identical; packaging it
        # into a tar.gz archive is CI-only, since local testing deploys dist/ straight
        # into ~/.litelens/plugins/<plugin_id> instead (see build:<plugin_id>:local).
        if: matrix.os == 'ubuntu-latest'
        run: |
          pnpm install --frozen-lockfile
          pnpm build:${{ inputs.plugin_id }}:fe
          mkdir -p build/plugin-bin
          tar -C plugins/${{ inputs.plugin_id }}/frontend/dist -czf "build/plugin-bin/${{ steps.artifact.outputs.frontend_name }}" .

      - name: Compute SHA256 checksums (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd build/plugin-bin
          # Use shasum (available on both macOS and Linux)
          shasum -a 256 "${{ steps.artifact.outputs.name }}" | awk '{print $1}' > "${{ steps.artifact.outputs.name }}.sha256"
          if [ "${{ runner.os }}" == "Linux" ]; then
            shasum -a 256 "${{ steps.artifact.outputs.frontend_name }}" | awk '{print $1}' > "${{ steps.artifact.outputs.frontend_name }}.sha256"
          fi

      - name: Compute SHA256 checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd build/plugin-bin
          $hash = Get-FileHash -Algorithm SHA256 "${{ steps.artifact.outputs.name }}" | Select-Object -ExpandProperty Hash
          $hash | Out-File -Encoding ascii "${{ steps.artifact.outputs.name }}.sha256"

      - name: Upload build artifact (binary + checksum)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/plugin-bin/
          retention-days: 1
          include-hidden-files: false

      - name: Upload to release
        if: ${{ inputs.version != 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          cd build/plugin-bin
          VERSION="${{ steps.resolve-version.outputs.version }}"
          gh release upload "$VERSION" "${{ steps.artifact.outputs.name }}" --repo "${{ github.repository }}" --clobber
          gh release upload "$VERSION" "${{ steps.artifact.outputs.name }}.sha256" --repo "${{ github.repository }}" --clobber
          if [ "${{ runner.os }}" == "Linux" ]; then
            gh release upload "$VERSION" "${{ steps.artifact.outputs.frontend_name }}" --repo "${{ github.repository }}" --clobber
            gh release upload "$VERSION" "${{ steps.artifact.outputs.frontend_name }}.sha256" --repo "${{ github.repository }}" --clobber
          fi

  manifest:
    name: Generate Manifest
    needs: [run]
    runs-on: ubuntu-latest
    if: ${{ success() && inputs.version != 'dev' }}
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve release version
        id: resolve-version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [ "${{ inputs.version }}" == "latest" ]; then
            VERSION=$(gh release view --json tagName -q .tagName --repo "${{ github.repository }}")
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compute artifact names
        id: artifact
        shell: bash
        run: |
          PLUGIN_ID="${{ inputs.plugin_id }}"
          LINUX_ARTIFACT="litelens-plugin-${PLUGIN_ID}-linux-amd64"
          DARWIN_ARTIFACT="litelens-plugin-${PLUGIN_ID}-darwin-arm64"
          # Must match steps.artifact.outputs.name from the `run` job exactly (that's the
          # upload-artifact `name:`, i.e. the artifact/directory name after download) —
          # Windows builds append matrix.ext (".exe") to the artifact name there, so it
          # must be included here too, both for the directory name and the binary filename.
          WINDOWS_ARTIFACT="litelens-plugin-${PLUGIN_ID}-windows-amd64.exe"
          FRONTEND="litelens-plugin-${PLUGIN_ID}-frontend"
          MANIFEST="litelens-plugin-${PLUGIN_ID}-manifest"
          echo "linux_artifact=$LINUX_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "darwin_artifact=$DARWIN_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "windows_artifact=$WINDOWS_ARTIFACT" >> "$GITHUB_OUTPUT"
          echo "frontend_name=${FRONTEND}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "manifest_name=${MANIFEST}.json" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Generate manifest
        shell: bash
        run: |
          set -euo pipefail
          # Extract version from tag (strip leading 'v')
          VERSION="${{ steps.resolve-version.outputs.version }}"
          VERSION="${VERSION#v}"

          LINUX_ARTIFACT="${{ steps.artifact.outputs.linux_artifact }}"
          DARWIN_ARTIFACT="${{ steps.artifact.outputs.darwin_artifact }}"
          WINDOWS_ARTIFACT="${{ steps.artifact.outputs.windows_artifact }}"
          FRONTEND_NAME="${{ steps.artifact.outputs.frontend_name }}"
          MANIFEST_NAME="${{ steps.artifact.outputs.manifest_name }}"

          # Read checksums and sizes from artifacts
          # Note: FRONTEND_NAME is now a tar.gz archive containing dist/index.js + chunk-*.js
          BUNDLE_SHA256=$(cat "artifacts/${LINUX_ARTIFACT}/${FRONTEND_NAME}.sha256")
          BUNDLE_SIZE=$(stat -c%s "artifacts/${LINUX_ARTIFACT}/${FRONTEND_NAME}")

          BINARY_SHA256=$(cat "artifacts/${LINUX_ARTIFACT}/${LINUX_ARTIFACT}.sha256")
          BINARY_SIZE=$(stat -c%s "artifacts/${LINUX_ARTIFACT}/${LINUX_ARTIFACT}")

          # Read platform-specific binary checksums and sizes
          DARWIN_SHA256=$(cat "artifacts/${DARWIN_ARTIFACT}/${DARWIN_ARTIFACT}.sha256")
          DARWIN_SIZE=$(stat -c%s "artifacts/${DARWIN_ARTIFACT}/${DARWIN_ARTIFACT}")

          WINDOWS_SHA256=$(cat "artifacts/${WINDOWS_ARTIFACT}/${WINDOWS_ARTIFACT}.sha256")
          WINDOWS_SIZE=$(stat -c%s "artifacts/${WINDOWS_ARTIFACT}/${WINDOWS_ARTIFACT}")

          # Resolve logo filename (<plugin_id>.svg/.png/.jpg/.jpeg, first match wins),
          # shared with deploy-plugin-<plugin_id>-local.mjs so both use the same source
          # file. The file itself is uploaded as a release asset in the next step;
          # manifest.assets.logo just records its filename for the installer to
          # download it under.
          LOGO_FILE=$(node plugins/${{ inputs.plugin_id }}/scripts/resolve-logo.mjs)

          # Split comma-separated capabilities into a JSON array
          CAPABILITIES_JSON=$(node -e "console.log(JSON.stringify('${{ inputs.plugin_capabilities }}'.split(',').map(s => s.trim()).filter(Boolean)))")

          # Generate manifest JSON
          jq -n \
            --arg id "${{ inputs.plugin_id }}" \
            --arg name "${{ inputs.plugin_name }}" \
            --arg description "${{ inputs.plugin_description }}" \
            --arg version "$VERSION" \
            --arg repository "https://github.com/gknguyen/litelens/releases" \
            --arg homepage "${{ inputs.plugin_homepage }}" \
            --arg bundleSha256 "$BUNDLE_SHA256" \
            --argjson bundleSize "$BUNDLE_SIZE" \
            --arg binarySha256 "$BINARY_SHA256" \
            --argjson binarySize "$BINARY_SIZE" \
            --arg darwinSha256 "$DARWIN_SHA256" \
            --argjson darwinSize "$DARWIN_SIZE" \
            --arg windowsSha256 "$WINDOWS_SHA256" \
            --argjson windowsSize "$WINDOWS_SIZE" \
            --arg binaryName "${{ inputs.plugin_binary_name }}" \
            --arg bundleDir "dist" \
            --arg logoFile "$LOGO_FILE" \
            --argjson capabilities "$CAPABILITIES_JSON" \
            '{
              id: $id,
              name: $name,
              description: $description,
              version: $version,
              repository: $repository,
              homepage: $homepage,
              minimumHostVersion: "0.1.0",
              maximumHostVersion: "999.999.999",
              os: {
                linux: ["amd64"],
                darwin: ["arm64"],
                windows: ["amd64"]
              },
              bundle: {
                sha256: $bundleSha256,
                size: $bundleSize
              },
              binary: {
                sha256: $binarySha256,
                size: $binarySize
              },
              binaries: {
                "linux-amd64": {
                  sha256: $binarySha256,
                  size: $binarySize
                },
                "darwin-arm64": {
                  sha256: $darwinSha256,
                  size: $darwinSize
                },
                "windows-amd64": {
                  sha256: $windowsSha256,
                  size: $windowsSize
                }
              },
              assets: ({
                binaryName: $binaryName,
                bundleDir: $bundleDir
              } + (if $logoFile != "" then {logo: $logoFile} else {} end)),
              capabilities: $capabilities
            }' > "$MANIFEST_NAME"

          cat "$MANIFEST_NAME"

      - name: Validate manifest JSON
        shell: bash
        run: jq empty "${{ steps.artifact.outputs.manifest_name }}"

      - name: Upload manifest to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.resolve-version.outputs.version }}"
          gh release upload "$VERSION" "${{ steps.artifact.outputs.manifest_name }}" --repo "${{ github.repository }}" --clobber

      - name: Upload logo to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          LOGO_FILE=$(node plugins/${{ inputs.plugin_id }}/scripts/resolve-logo.mjs)
          if [ -z "$LOGO_FILE" ]; then
            echo "No logo file found, skipping upload."
            exit 0
          fi
          VERSION="${{ steps.resolve-version.outputs.version }}"
          EXT="${LOGO_FILE##*.}"
          LOGO_ASSET_NAME="litelens-plugin-${{ inputs.plugin_id }}-logo.${EXT}"
          cp "plugins/${{ inputs.plugin_id }}/${LOGO_FILE}" "${LOGO_ASSET_NAME}"
          gh release upload "$VERSION" "$LOGO_ASSET_NAME" --repo "${{ github.repository }}" --clobber
