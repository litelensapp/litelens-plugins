name: Unit Tests

on:
  workflow_call:
    inputs:
      plugin_id:
        type: string
        required: true
        # Short plugin identifier, e.g. "helm". Drives the plugins/<plugin_id>/
        # source path, pnpm script name (test:<plugin_id>:fe:coverage), and every
        # report/artifact name, matching job-build.yml's convention.
      plugin_name:
        type: string
        required: true
        # Display name used in coverage report headers, e.g. "Helm".
      RUNNER:
        type: string
        required: false
        default: ubuntu-latest
      BE_TARGET_PATH:
        description: "Go packages to test (e.g. ./...)"
        type: string
        required: false
        default: "./..."
      BE_COVERAGE_IGNORE_FILE:
        type: string
        required: false
        default: coverage.ignore

jobs:
  backend:
    runs-on: ${{ inputs.RUNNER }}
    permissions:
      contents: read
      pull-requests: write
      actions: write
    env:
      BE_TEST_REPORT_FOLDER: be-plugin-${{ inputs.plugin_id }}-unit-test
    defaults:
      run:
        working-directory: plugins/${{ inputs.plugin_id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go from go.mod
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: plugins/${{ inputs.plugin_id }}/go.mod
          cache-dependency-path: plugins/${{ inputs.plugin_id }}/go.sum

      - name: Run tests
        if: ${{ always() }}
        run: go test -race -v -cover -coverprofile=coverage.out ${{ inputs.BE_TARGET_PATH }}

      - name: Generate test reports
        if: ${{ always() }}
        run: |
          mkdir ${{ env.BE_TEST_REPORT_FOLDER }}

          COVERAGE_FILE=coverage.out
          if [ -f "${{ inputs.BE_COVERAGE_IGNORE_FILE }}" ]; then
            grep -v -f ${{ inputs.BE_COVERAGE_IGNORE_FILE }} coverage.out > coverage.filtered.out
            COVERAGE_FILE=coverage.filtered.out
          fi

          go tool cover -func=$COVERAGE_FILE > ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.txt
          go tool cover -html=$COVERAGE_FILE -o ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.html

      - name: Convert coverage to Markdown table
        id: be-test-summary
        if: ${{ always() }}
        run: |
          TOTAL=$(grep -E '^total:' ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.txt | awk '{print $3}')
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

          {
            echo "## ${{ inputs.plugin_name }} Plugin BE Code Coverage Report"
            echo ""
            echo "**Total Coverage:** \`$TOTAL\`"
            echo ""
            echo "| File | Function | Coverage |"
            echo "| :--- | :--- | ---: |"

            MODULE=$(grep '^module ' go.mod | awk '{print $2}')
            grep -v '^total:' ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.txt | while IFS= read -r line; do
              RAW_FILE=$(echo "$line" | awk '{print $1}')
              FILE=$(echo "$RAW_FILE" | sed -E 's#:[0-9]+:$##' | sed "s#^${MODULE}/##")
              FUNC=$(echo "$line" | awk '{print $2}')
              COV=$(echo "$line" | awk '{print $3}')
              echo "| \`$FILE\` | \`$FUNC\` | $COV |"
            done
          } > ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.md

      - name: Add coverage to job summary
        if: ${{ always() }}
        run: cat ${{ env.BE_TEST_REPORT_FOLDER }}/coverage.md >> $GITHUB_STEP_SUMMARY

      - name: Attach coverage report to PR
        uses: marocchino/sticky-pull-request-comment@0ea0beb66eb9baf113663a64ec522f60e49231c0 # v3.0.4
        if: ${{ always() && github.event_name == 'pull_request' }}
        with:
          header: be-plugin-${{ inputs.plugin_id }}-coverage-report
          message: |
            ### ${{ inputs.plugin_name }} Plugin BE Coverage Report Summary

            **Total Coverage:** ${{ steps.be-test-summary.outputs.total }}

            [View full report](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Archive coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: report-${{ env.BE_TEST_REPORT_FOLDER }}
          path: plugins/${{ inputs.plugin_id }}/${{ env.BE_TEST_REPORT_FOLDER }}
          retention-days: 1
          include-hidden-files: false

  frontend:
    runs-on: ${{ inputs.RUNNER }}
    permissions:
      contents: read
      pull-requests: write
    env:
      FE_COVERAGE_DIR: plugins/${{ inputs.plugin_id }}/frontend/coverage

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build design-system
        run: pnpm build:ds

      - name: Run tests with coverage
        run: pnpm test:${{ inputs.plugin_id }}:fe:coverage

      - name: Upload coverage report
        id: coverage-artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-${{ inputs.plugin_id }}-fe-coverage
          path: ${{ env.FE_COVERAGE_DIR }}
          retention-days: 1

      - name: Parse coverage report
        id: coverage-report-summary
        run: |
          echo 'summary<<EOF' >> $GITHUB_OUTPUT
          cat ${{ env.FE_COVERAGE_DIR }}/summary.txt >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Post PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          COVERAGE_SUMMARY: ${{ steps.coverage-report-summary.outputs.summary }}
          ARTIFACT_URL: ${{ steps.coverage-artifact.outputs.artifact-url }}
          PLUGIN_ID: ${{ inputs.plugin_id }}
          PLUGIN_NAME: ${{ inputs.plugin_name }}
        with:
          script: |
            const tag = `<!-- plugin-${process.env.PLUGIN_ID}-fe-coverage-report -->`;
            const body = `${tag}\n### ${process.env.PLUGIN_NAME} Plugin FE Coverage Report Summary\n\n\`\`\`\n${process.env.COVERAGE_SUMMARY}\n\`\`\`\n\n[Coverage Report](${process.env.ARTIFACT_URL})`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            const existing = comments.find(c => c.body.includes(tag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body
              });
            }
