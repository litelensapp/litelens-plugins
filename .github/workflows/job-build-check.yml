name: Build Check

on:
  workflow_call:
    inputs:
      plugin_id:
        type: string
        required: true
        # Short plugin identifier, e.g. "helm". Drives the pnpm script name
        # (build:<plugin_id>), matching job-build.yml's convention.
      RUNNER:
        type: string
        required: false
        default: ubuntu-latest

jobs:
  run:
    runs-on: ${{ inputs.RUNNER }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go from go.mod
        uses: ./.github/actions/setup-go
        with:
          go-version-file: plugins/${{ inputs.plugin_id }}/go.mod

      - name: Setup Node.js + pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          ignore-scripts: "false"

      - name: Build plugin binary
        shell: bash
        run: pnpm build:${{ inputs.plugin_id }}
