packages:
  - "plugins/helm/frontend"
allowBuilds:
  "@parcel/watcher": true
  esbuild: true
catalog:
  "@testing-library/jest-dom": ^6.9.1
  "@testing-library/react": ^16.3.2
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.4
  "@vitejs/plugin-react": ^6.0.5
  "@vitest/coverage-v8": ^4.1.10
  cross-env: ^10.1.0
  esbuild-visualizer: ^0.7.0
  jsdom: ^29.1.1
  typescript: ^6.0.3
  vitest: ^4.1.10
# @litelens/core versions below were just published to the local verdaccio test registry (see
# .npmrc), so pnpm's minimumReleaseAge check would otherwise flag them as suspiciously fresh.
# Remove this exclusion once @litelens/core is a real, aged npm release.
minimumReleaseAgeExclude:
  - '@litelens/core@0.9.2'
  - '@litelens/core@0.9.3'
  - '@litelens/core@0.9.4'
  - '@litelens/core@0.9.5'
  - '@litelens/core@0.9.6'
